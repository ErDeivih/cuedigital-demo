<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Sin `user-scalable=no` a propósito: quien ve poco tiene que poder ampliar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#175C33">
  <meta name="description" content="El cuaderno de campo, en el móvil y en castellano.">
  <title>CUE Digital</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="icon" type="image/svg+xml" href="marca.svg">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <!-- Demo sin servidor: los datos van dentro y la pantalla no pide nada a nadie. -->
  <script src="demo-datos.js"></script>
  <script src="demo.js"></script>
</head>
<body>
  <!-- La pantalla la pinta React dentro de este nodo. -->
  <div id="app"></div>

  <!-- React, sin compilar: son los ficheros oficiales de `web/vendor/` (con su licencia y
       su LEEME). Tienen que ir ANTES del módulo: si no, `app.js` no encuentra `React` ni
       `htm` cuando se carga. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/htm.umd.js"></script>

  <script type="module" src="app.js"></script>
</body>
</html>
